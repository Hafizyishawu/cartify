<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set a new password · Certifiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./certifiles.css">
</head>
<body>
<div class="wrap">
  <div id="nav"></div>
  <h1>Set a new password</h1>

  <div class="form" id="form" hidden>
    <div id="error"></div>
    <div class="field">
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password">
      <div class="hint">At least 12 characters. Length beats punctuation.</div>
    </div>
    <div class="field">
      <label for="confirm">Type it again</label>
      <input id="confirm" type="password" autocomplete="new-password">
    </div>
    <button id="submit" type="button">Set password</button>
  </div>

  <div class="form" id="bad" hidden></div>

  <div class="form" id="done" hidden>
    <div class="ok">Password changed.</div>
    <p class="muted">Every signed-in session was ended, including any you did not recognise.
      Sign in again with the new password and your authenticator app.</p>
    <p><a href="./sign-in.html">Sign in</a></p>
  </div>
</div>
<script type="module" src="./pages/reset-password.js"></script>
</body>
</html>
