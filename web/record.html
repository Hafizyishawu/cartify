<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record · Certifiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./certifiles.css">
<style>
  .record-head{display:grid;grid-template-columns:132px minmax(0,1fr);gap:24px}
  @media (max-width:620px){.record-head{grid-template-columns:minmax(0,1fr)}}
  .work-title{font-size:22px;font-weight:600;margin:0 0 4px;letter-spacing:-.015em}
  .by{color:var(--muted);font-size:14px;margin:0 0 12px}
  .assurance{display:inline-flex;gap:8px;font-family:var(--mono);font-size:11px;
             text-transform:uppercase;letter-spacing:.1em;color:var(--muted);
             border:1px solid var(--rule-firm);border-radius:2px;padding:2px 8px}
  .copy{margin-left:auto;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <div id="nav"></div>
  <div style="display:flex;justify-content:flex-end;margin:-24px 0 16px">
    <button id="copy" class="btn-ghost" type="button">Copy link</button>
  </div>
  <div id="out"><p class="muted">Loading the record…</p></div>
</div>

<script type="module" src="./pages/record.js"></script>
</body>
</html>
