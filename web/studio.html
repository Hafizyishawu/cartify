<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoring · Certifiles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="./certifiles.css">
<style>
  .dash{display:grid;grid-template-columns:210px minmax(0,1fr);gap:32px;align-items:start}
  @media (max-width:820px){.dash{grid-template-columns:minmax(0,1fr)}}
  .alert-top{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}
  .band{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
        text-transform:uppercase;font-weight:600}
  .when{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:auto}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:620px){.compare{grid-template-columns:minmax(0,1fr)}}
  .side-by{border:1px solid var(--rule);border-radius:3px;padding:12px;background:var(--paper)}
  .side-by .t{font-size:14px;font-weight:500;margin:8px 0 2px}
  .side-by .m{font-family:var(--mono);font-size:11.5px;color:var(--muted);
              line-height:1.6;word-break:break-all}
  .actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  .notice{border-left:2px solid var(--accent);padding-left:12px;margin:0 0 24px;
          font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap wide">
  <div id="nav"></div>
  <div class="mono" style="text-align:right;margin:-24px 0 16px;font-size:13px;color:var(--muted)" id="who"></div>
  <div id="out"><p class="muted">Reading the published log…</p></div>
</div>

<script type="module" src="./pages/studio.js"></script>
</body>
</html>
